apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/version: 1.0.0
  name: default-deny-ingress
  namespace: attendance-system
spec:
  podSelector: {}
  policyTypes:
  - Ingress
