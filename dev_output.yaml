  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/name: redis
      app.kubernetes.io/version: 1.0.0
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
