apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: attendance-system
    app.kubernetes.io/part-of: attendance-management
    app.kubernetes.io/version: 1.0.0
  name: attendance-system
---
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/component: sa
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: attendance-system
    app.kubernetes.io/version: 1.0.0
  name: attendance-sa
  namespace: attendance-system
---
apiVersion: v1
data:
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  DB_HOST: postgres
  DB_NAME: attendance
  DB_PORT: "5432"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  DJANGO_DEBUG: "0"
  DJANGO_SETTINGS_MODULE: attendance_system_facial_recognition.settings.production
  FEATURE_FAISS_ENABLED: "true"
  FEATURE_LIVENESS_DETECTION_ENABLED: "true"
  FEATURE_MULTI_FACE_ENABLED: "true"
  RECOGNITION_DEEPFACE_DETECTOR: ssd
  RECOGNITION_DEEPFACE_MODEL: Facenet
  RECOGNITION_DISTANCE_THRESHOLD: "0.45"
  TF_CPP_MIN_LOG_LEVEL: "2"
  TF_FORCE_GPU_ALLOW_GROWTH: "true"
  redis.conf: |
    appendonly yes
    maxmemory 256mb
    maxmemory-policy volatile-lru
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: attendance-system
    app.kubernetes.io/version: 1.0.0
  name: attendance-config
  namespace: attendance-system
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: postgres
    app.kubernetes.io/version: 1.0.0
  name: postgres
  namespace: attendance-system
spec:
  clusterIP: None
  ports:
  - name: postgres
    port: 5432
    protocol: TCP
    targetPort: postgres
  selector:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: postgres
    app.kubernetes.io/version: 1.0.0
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: cache
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: redis
    app.kubernetes.io/version: 1.0.0
  name: redis
  namespace: attendance-system
spec:
  clusterIP: None
  ports:
  - name: redis
    port: 6379
    protocol: TCP
    targetPort: redis
  selector:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: redis
    app.kubernetes.io/version: 1.0.0
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: web
    app.kubernetes.io/version: 1.0.0
  name: web
  namespace: attendance-system
spec:
  ports:
  - name: http
    port: 8000
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: web
    app.kubernetes.io/version: 1.0.0
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/component: storage
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: attendance-system
    app.kubernetes.io/version: 1.0.0
  name: face-recognition-data
  namespace: attendance-system
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/component: storage
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: attendance-system
    app.kubernetes.io/version: 1.0.0
  name: media-data
  namespace: attendance-system
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: celery-beat
    app.kubernetes.io/part-of: attendance-system
    app.kubernetes.io/version: 1.0.0
  name: celery-beat
  namespace: attendance-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/name: celery-beat
      app.kubernetes.io/version: 1.0.0
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: scheduler
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/name: celery-beat
        app.kubernetes.io/version: 1.0.0
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - celery
        - -A
        - attendance_system_facial_recognition
        - beat
        - --loglevel=info
        envFrom:
        - configMapRef:
            name: attendance-config
        - secretRef:
            name: attendance-secrets
        image: attendance-system:v1.7.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - ps aux | grep '[c]elery' | grep 'beat' || exit 1
          failureThreshold: 3
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        name: celery-beat
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - ps aux | grep '[c]elery' | grep 'beat' || exit 1
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 100m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: attendance-sa
      volumes:
      - emptyDir: {}
        name: tmp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: worker
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: celery-worker
    app.kubernetes.io/part-of: attendance-system
    app.kubernetes.io/version: 1.0.0
  name: celery-worker
  namespace: attendance-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/name: celery-worker
      app.kubernetes.io/version: 1.0.0
  template:
    metadata:
      labels:
        app.kubernetes.io/component: worker
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/name: celery-worker
        app.kubernetes.io/version: 1.0.0
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - celery
        - -A
        - attendance_system_facial_recognition
        - worker
        - --loglevel=info
        - --concurrency=2
        envFrom:
        - configMapRef:
            name: attendance-config
        - secretRef:
            name: attendance-secrets
        image: attendance-system:v1.7.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - celery -A attendance_system_facial_recognition inspect ping -d celery@$HOSTNAME
          failureThreshold: 3
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        name: celery
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - celery -A attendance_system_facial_recognition inspect ping -d celery@$HOSTNAME
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /app/face_recognition_data
          name: face-data
        - mountPath: /app/media
          name: media
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: attendance-sa
      volumes:
      - name: face-data
        persistentVolumeClaim:
          claimName: face-recognition-data
      - name: media
        persistentVolumeClaim:
          claimName: media-data
      - emptyDir: {}
        name: tmp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: attendance-system
    app.kubernetes.io/version: 1.0.0
  name: web
  namespace: attendance-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/name: web
      app.kubernetes.io/version: 1.0.0
  template:
    metadata:
      annotations:
        prometheus.io/path: /monitoring/metrics/
        prometheus.io/port: "8000"
        prometheus.io/scrape: "true"
      labels:
        app.kubernetes.io/component: backend
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/name: web
        app.kubernetes.io/version: 1.0.0
    spec:
      automountServiceAccountToken: false
      containers:
      - envFrom:
        - configMapRef:
            name: attendance-config
        - secretRef:
            name: attendance-secrets
        image: attendance-system:v1.7.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /monitoring/metrics/
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        name: web
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /monitoring/metrics/
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /app/face_recognition_data
          name: face-data
        - mountPath: /app/media
          name: media
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: attendance-sa
      volumes:
      - name: face-data
        persistentVolumeClaim:
          claimName: face-recognition-data
      - name: media
        persistentVolumeClaim:
          claimName: media-data
      - emptyDir: {}
        name: tmp
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: attendance-system
    app.kubernetes.io/version: 1.0.0
  name: postgres
  namespace: attendance-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/name: postgres
      app.kubernetes.io/version: 1.0.0
  serviceName: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/component: database
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/name: postgres
        app.kubernetes.io/version: 1.0.0
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              key: DB_NAME
              name: attendance-config
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              key: DB_USER
              name: attendance-secrets
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: attendance-secrets
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        image: postgres:16.2-alpine
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        name: postgres
        ports:
        - containerPort: 5432
          name: postgres
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: postgres-data
        - mountPath: /var/run/postgresql
          name: postgres-run
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 70
        runAsGroup: 70
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: attendance-sa
      volumes:
      - emptyDir: {}
        name: postgres-run
      - emptyDir: {}
        name: tmp
  volumeClaimTemplates:
  - metadata:
      labels:
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/version: 1.0.0
      name: postgres-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/component: cache
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: attendance-system
    app.kubernetes.io/version: 1.0.0
  name: redis
  namespace: attendance-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/name: redis
      app.kubernetes.io/version: 1.0.0
  serviceName: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/component: cache
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/name: redis
        app.kubernetes.io/version: 1.0.0
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - redis-server
        - /usr/local/etc/redis/redis.conf
        image: redis:8.6.3-alpine
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          failureThreshold: 3
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        name: redis
        ports:
        - containerPort: 6379
          name: redis
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 200m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /data
          name: redis-data
        - mountPath: /usr/local/etc/redis
          name: redis-config
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: attendance-sa
      volumes:
      - configMap:
          items:
          - key: redis.conf
            path: redis.conf
          name: attendance-config
        name: redis-config
      - emptyDir: {}
        name: tmp
  volumeClaimTemplates:
  - metadata:
      labels:
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/version: 1.0.0
      name: redis-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    app.kubernetes.io/component: worker
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: celery-worker
    app.kubernetes.io/part-of: attendance-system
    app.kubernetes.io/version: 1.0.0
  name: celery-worker-pdb
  namespace: attendance-system
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/name: celery-worker
      app.kubernetes.io/version: 1.0.0
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: attendance-system
    app.kubernetes.io/version: 1.0.0
  name: web-pdb
  namespace: attendance-system
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/name: web
      app.kubernetes.io/version: 1.0.0
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: attendance-system
    app.kubernetes.io/version: 1.0.0
  name: attendance-secrets
  namespace: attendance-system
spec:
  encryptedData:
    DATA_ENCRYPTION_KEY: AgBD...
    DB_PASSWORD: AgBD...
    DB_USER: AgBD...
    DJANGO_SECRET_KEY: AgBD...
    FACE_DATA_ENCRYPTION_KEY: AgBD...
    POSTGRES_PASSWORD: AgBD...
  template:
    metadata:
      labels:
        app.kubernetes.io/name: attendance-system
      name: attendance-secrets
    type: Opaque
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/limit-connections: "5"
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/upstream-hash-by: $request_uri
  labels:
    app.kubernetes.io/component: ingress
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: attendance-system
    app.kubernetes.io/version: 1.0.0
  name: attendance-ingress
  namespace: attendance-system
spec:
  ingressClassName: nginx
  rules:
  - host: attendance.example.com
    http:
      paths:
      - backend:
          service:
            name: web
            port:
              number: 8000
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - attendance.example.com
    secretName: attendance-tls
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/version: 1.0.0
  name: allow-postgres-access
  namespace: attendance-system
spec:
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - web
          - celery-worker
          - celery-beat
    ports:
    - port: 5432
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/name: postgres
      app.kubernetes.io/version: 1.0.0
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/version: 1.0.0
  name: allow-redis-access
  namespace: attendance-system
spec:
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
