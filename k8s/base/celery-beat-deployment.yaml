# Celery Beat scheduler deployment for periodic tasks
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: attendance-system
  labels:
    app.kubernetes.io/name: celery-beat
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/part-of: attendance-system
spec:
  replicas: 1  # Only one beat instance should run
  strategy:
    type: Recreate  # Prevent multiple instances during updates
  selector:
    matchLabels:
      app.kubernetes.io/name: celery-beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celery-beat
        app.kubernetes.io/component: scheduler
    spec:
      serviceAccountName: attendance-sa
      automountServiceAccountToken: false
      # Pod-level security context enforces running as a non-root user for enhanced security.
      # User 1000 is chosen to map to the non-root 'appuser' defined in the Dockerfile.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: celery-beat
          image: attendance-system:v1.7.0
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - attendance_system_facial_recognition
            - beat
            - --loglevel=info
          envFrom:
            - configMapRef:
                name: attendance-config
            - secretRef:
                name: attendance-secrets
          # Resource limits and requests defined for optimal scheduling and to prevent resource starvation.
          # (128Mi/256Mi for lightweight scheduling tasks)
          # Celery beat is a lightweight periodic task scheduler, requiring far fewer resources compared to worker nodes.
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "100m"
          # Liveness probe ensures the pod is automatically restarted if it becomes unresponsive.
          # Exec probe validates the celery beat process is active, mitigating deadlocks.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - ps aux | grep '[c]elery' | grep 'beat' || exit 1
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          # Readiness probe ensures traffic is only routed to the pod when it is fully ready to serve requests.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - ps aux | grep '[c]elery' | grep 'beat' || exit 1
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Apply least-privilege security context to container to prevent privilege escalation.
          # readOnlyRootFilesystem guards against compromise, and dropping ALL capabilities revokes irrelevant kernel syscalls.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
