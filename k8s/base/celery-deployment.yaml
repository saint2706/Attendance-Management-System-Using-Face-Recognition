# Celery worker deployment for async task processing
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: attendance-system
  labels:
    app.kubernetes.io/name: celery-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: attendance-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: celery-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celery-worker
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: attendance-sa
      automountServiceAccountToken: false
      # Pod-level security context enforces running as a non-root user for enhanced security.
      # User 1000 is chosen to map to the non-root 'appuser' defined in the Dockerfile.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: celery
          image: attendance-system:v1.7.0
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - attendance_system_facial_recognition
            - worker
            - --loglevel=info
            - --concurrency=2
          envFrom:
            - configMapRef:
                name: attendance-config
            - secretRef:
                name: attendance-secrets
          # Resource limits and requests defined for optimal scheduling and to prevent resource starvation. (512Mi/2Gi for memory-intensive web/worker tasks)
          # Reserving 512Mi accommodates the base Python process, while 2Gi handles peak memory loads during background facial recognition processing.
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          # Liveness probe ensures the pod is automatically restarted if it becomes unresponsive.
          # Exec probe runs `celery inspect ping` to ensure deadlocked tasks trigger automated restart operations.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'celery -A attendance_system_facial_recognition inspect ping -d celery@$HOSTNAME'
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          # Readiness probe ensures traffic is only routed to the pod when it is fully ready to serve requests.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'celery -A attendance_system_facial_recognition inspect ping -d celery@$HOSTNAME'
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: face-data
              mountPath: /app/face_recognition_data
            - name: media
              mountPath: /app/media
            - name: tmp
              mountPath: /tmp
          # Apply least-privilege security context to container to prevent privilege escalation.
          # readOnlyRootFilesystem guards the primary image against compromise, while dropping ALL capabilities revokes irrelevant kernel syscalls.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: face-data
          persistentVolumeClaim:
            claimName: face-recognition-data
        - name: media
          persistentVolumeClaim:
            claimName: media-data
        - name: tmp
          emptyDir: {}
