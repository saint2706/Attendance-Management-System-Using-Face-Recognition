# Django web application deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: attendance-system
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: attendance-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: attendance-sa
      automountServiceAccountToken: false
      # Pod-level security context enforces running as a non-root user for enhanced security.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: attendance-system:v1.7.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: attendance-config
            - secretRef:
                name: attendance-secrets
          # Resource limits and requests defined for optimal scheduling and to prevent resource starvation. (512Mi/2Gi for memory-intensive web/worker tasks)
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          # Liveness probe ensures the pod is automatically restarted if it becomes unresponsive.
          livenessProbe:
            httpGet:
              path: /monitoring/metrics/
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          # Readiness probe ensures traffic is only routed to the pod when it is fully ready to serve requests.
          readinessProbe:
            httpGet:
              path: /monitoring/metrics/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: face-data
              mountPath: /app/face_recognition_data
            - name: media
              mountPath: /app/media
            - name: tmp
              mountPath: /tmp
          # Apply least-privilege security context to container to prevent privilege escalation.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: face-data
          persistentVolumeClaim:
            claimName: face-recognition-data
        - name: media
          persistentVolumeClaim:
            claimName: media-data
        - name: tmp
          emptyDir: {}
